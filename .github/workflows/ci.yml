name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

permissions:
  contents: read

jobs:
  test:
    runs-on: ubuntu-24.04
    strategy:
      fail-fast: false
      matrix:
        python-version: ["3.11", "3.12", "3.13"]

    steps:
      - name: Check out repository
        uses: actions/checkout@v5

      - name: Set up Python
        uses: actions/setup-python@v6
        with:
          python-version: ${{ matrix.python-version }}

      - name: Install test dependencies
        run: |
          python -m pip install --upgrade pip
          python -m pip install -r requirements-test.txt

      - name: Compile source
        run: python -m compileall -q src run_pipeline.py

      - name: Run tests
        run: python -m pytest -q

      - name: Validate CLI surface
        run: python run_pipeline.py --help

  runtime-compatibility:
    runs-on: ubuntu-24.04
    steps:
      - name: Check out repository
        uses: actions/checkout@v5

      - name: Set up Python
        uses: actions/setup-python@v6
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: requirements.txt

      - name: Install runtime dependencies
        run: |
          python -m pip install --upgrade pip
          python -m pip install -r requirements.txt

      - name: Import runtime stack
        run: |
          python - <<'PY'
          import datasets
          import sentencepiece
          import torch
          import transformers

          print("datasets", datasets.__version__)
          print("transformers", transformers.__version__)
          print("torch", torch.__version__)
          print("sentencepiece", sentencepiece.__version__)
          PY

  quality:
    runs-on: ubuntu-24.04
    steps:
      - name: Check out repository
        uses: actions/checkout@v5

      - name: Set up Python
        uses: actions/setup-python@v6
        with:
          python-version: "3.12"

      - name: Install Ruff
        run: python -m pip install --upgrade ruff

      - name: Lint source and tests
        run: ruff check src tests run_pipeline.py

  dependency-audit:
    runs-on: ubuntu-24.04
    steps:
      - name: Check out repository
        uses: actions/checkout@v5

      - name: Set up Python
        uses: actions/setup-python@v6
        with:
          python-version: "3.12"

      - name: Install audit tooling
        run: python -m pip install --upgrade pip pip-audit

      - name: Audit declared dependencies
        run: pip-audit -r requirements.txt
